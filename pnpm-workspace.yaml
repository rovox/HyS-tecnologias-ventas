packages:
  - 'apps/*'

# Hostinger cannot execute esbuild (noexec on hbuilds and /tmp). Skip its postinstall
# so `pnpm install` succeeds; the SPA is pre-built and committed in apps/web/dist.
ignoredBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: false
packageImportMethod: copy
confirmModulesPurge: false
